syntax = "proto3";

package er;

import "AbilityEnum.proto";
import "ScriptConditions.proto";
import "SpeciesEnum.proto";
import "MoveEnum.proto";
import "Types.proto";

option java_package = "er.proto";
option java_multiple_files = true;

// A hell-mode battle rule, written in a trainer's `hell {}` block:
//   WHEN `trigger` fires for a mon (the "subject"), IF every `filter` passes, DO each `effect`.
// Example (Josh): rule { trigger { entry { when: LEAD } } effect { stat_change { stat: RULE_STAT_DEF amount: 4 } } }
message BattleRule {
  RuleTrigger trigger = 1;
  // All must pass. Use any_of / all_of / negate for anything fancier.
  repeated RuleFilter filter = 2;
  // Run in order, after one popup + announce for the whole rule. Max 8.
  repeated RuleEffect effect = 3;
  RuleLimit limit = 4;
  // Popup text. Generated from the first effect when empty.
  string name = 5;
  // Text box line, shown the first time the rule fires in a battle. Generic text when empty.
  string announce = 6;
}

// Whose mon the event is about. Rules belong to the trainer, so TRAINER is the default.
enum RuleSide {
  RULE_SIDE_TRAINER = 0;
  RULE_SIDE_PLAYER = 1;
  RULE_SIDE_ANY = 2;
}

message RuleEmpty {}

message RuleTrigger {
  // Whose mon the event is about (entry / end_turn only).
  RuleSide whose = 1;
  oneof kind {
    // Subject = the mon coming in (battle-start leads included).
    RuleEntry entry = 2;
    // Subject = each active mon of `whose`, at the end of the turn.
    RuleTurnTick end_turn = 3;
    // Once, when the battle starts. No subject: hazard and field effects only.
    RuleEmpty battle_start = 4;
    // Keeps its effects in place: applied at battle start, then silently put back at the end of any turn
    // they're gone (Defog, Rapid Spin, a weather change...). No subject: hazard, field and ability effects only.
    RuleEmpty always = 5;
  }
}

message RuleEntry {
  enum When {
    // Every time a mon comes in, including a mon coming back.
    EVERY = 0;
    // Only the mons on the field when the battle starts.
    LEAD = 1;
    // Each mon once, the first time it comes in (lead or not).
    FIRST = 2;
  }
  When when = 1;
}

message RuleTurnTick {
  // Default (neither set): every turn.
  oneof when {
    // Fires on turns N, 2N, 3N...
    int32 every = 1;
    // Fires once, on turn N.
    int32 after = 2;
  }
  // Count the turns this mon has been on the field instead of battle turns.
  bool on_field = 3;
}

message RuleFilter {
  bool negate = 1;
  oneof kind {
    RuleMon mon = 2;
    // Weather is active and affects the subject (Utility Umbrella, Cloud Nine...).
    Weather weather = 3;
    Type mon_type = 4;
    // Percent, 1-100. Put it last: filters are checked in order.
    int32 chance = 5;
    RuleFilterList any_of = 6;
    RuleFilterList all_of = 7;
  }
}

message RuleFilterList {
  repeated RuleFilter filter = 1;
}

// Which of its party the subject is. Slots follow party order.
message RuleMon {
  oneof kind {
    int32 first_n = 1;
    int32 last_n = 2;
    // The subject is the only mon of its party still able to fight.
    RuleEmpty last_remaining = 3;
    SpeciesEnum species = 4;
  }
}

// Battlers, relative to the subject.
enum RuleTarget {
  RULE_TARGET_SUBJECT = 0;
  RULE_TARGET_SUBJECT_ALLY = 1;
  RULE_TARGET_SUBJECT_FOES = 2;
}

message RuleEffect {
  // Who the effect applies to (for use_move: the move's target).
  RuleTarget target = 1;
  oneof kind {
    RuleStatChange stat_change = 2;
    RuleUseMove use_move = 3;
    // Percent of max HP, 1-100.
    int32 heal_percent = 4;
    RuleHazard hazard = 5;
    RuleField field = 6;
    // `always` rules only. Every Pokemon of the trainer has this ability on top of its own, for the whole
    // battle (3 per trainer, old battle events included).
    AbilityEnum ability = 7;
  }
}

// Where a hazard or side condition goes. Required.
enum RuleFieldSide {
  RULE_FIELD_SIDE_UNSET = 0;
  RULE_FIELD_SIDE_PLAYER = 1;
  RULE_FIELD_SIDE_TRAINER = 2;
  RULE_FIELD_SIDE_BOTH = 3;
}

// Hazard and field effects only do something when it's missing, so they never stack or spam.
message RuleHazard {
  enum Kind {
    SPIKES = 0;
    TOXIC_SPIKES = 1;
    STEALTH_ROCK = 2;
    STICKY_WEB = 3;
    // Sticky Web that Defog, Rapid Spin and Court Change don't remove (like the Foamy Web ability)
    FOAMY_WEB = 4;
    CALTROPS = 5;
    HOT_COALS = 6;
  }
  Kind kind = 1;
  RuleFieldSide side = 2;
  // Spikes / Toxic Spikes: at least this many layers (up to 3 / 2). Default 1.
  int32 layers = 3;
}

message RuleField {
  oneof kind {
    // Replaces the current weather.
    RuleWeather weather = 1;
    // Replaces the current terrain.
    RuleTerrain terrain = 2;
    // Whole field.
    RuleRoom room = 3;
    RuleSideCondition side_condition = 4;
  }
  // 0 = permanent. Permanent weather also stops anything else from changing it.
  int32 turns = 5;
}

enum RuleWeather {
  RULE_WEATHER_RAIN = 0;
  RULE_WEATHER_SUN = 1;
  RULE_WEATHER_SANDSTORM = 2;
  RULE_WEATHER_HAIL = 3;
  RULE_WEATHER_FOG = 4;
  RULE_WEATHER_HEAVY_RAIN = 5;
  RULE_WEATHER_HARSH_SUN = 6;
  RULE_WEATHER_STRONG_WINDS = 7;
}

enum RuleTerrain {
  RULE_TERRAIN_ELECTRIC = 0;
  RULE_TERRAIN_GRASSY = 1;
  RULE_TERRAIN_MISTY = 2;
  RULE_TERRAIN_PSYCHIC = 3;
  RULE_TERRAIN_TOXIC = 4;
}

enum RuleRoom {
  RULE_ROOM_TRICK_ROOM = 0;
  RULE_ROOM_MAGIC_ROOM = 1;
  RULE_ROOM_WONDER_ROOM = 2;
  RULE_ROOM_INVERSE_ROOM = 3;
  RULE_ROOM_GRAVITY = 4;
  RULE_ROOM_MUD_SPORT = 5;
  RULE_ROOM_WATER_SPORT = 6;
}

message RuleSideCondition {
  enum Kind {
    REFLECT = 0;
    LIGHT_SCREEN = 1;
    AURORA_VEIL = 2;
    TAILWIND = 3;
    MIST = 4;
    SAFEGUARD = 5;
    LUCKY_CHANT = 6;
    SWAMP = 7;
    SEA_OF_FIRE = 8;
    RAINBOW = 9;
    SMOKESCREEN = 10;
  }
  Kind kind = 1;
  RuleFieldSide side = 2;
}

enum RuleStat {
  RULE_STAT_ATK = 0;
  RULE_STAT_DEF = 1;
  RULE_STAT_SPEED = 2;
  RULE_STAT_SPATK = 3;
  RULE_STAT_SPDEF = 4;
  RULE_STAT_ACC = 5;
  RULE_STAT_EVASION = 6;
  // Highest of Atk/Def/Speed/SpAtk/SpDef (raw stats, stages ignored).
  RULE_STAT_HIGHEST = 7;
  // Higher of Atk/SpAtk.
  RULE_STAT_HIGHEST_OFFENSE = 8;
  // Atk, Def, Speed, SpAtk and SpDef (omniboost).
  RULE_STAT_ALL = 9;
}

message RuleStatChange {
  repeated RuleStat stat = 1;
  // -6 to 6, not 0. Negative lowers.
  int32 amount = 2;
  // A change on the player's Pokemon counts as caused by the trainer's Pokemon, like a move or ability:
  // Clear Body, Mist, Mirror Armor etc. can stop it (Protect can't). Set this to skip all of that.
  // Changes on the trainer's own Pokemon are always self-applied. Contrary and Simple apply either way.
  bool unblockable = 3;
}

// Queues a real extra attack, like abilities that use moves, so Protect, redirection, immunities etc.
// all apply as for any move.
message RuleUseMove {
  MoveEnum move = 1;
  // Base power override, 0 = the move's own.
  int32 power = 2;
  // Who uses it, picked at random if several match.
  RuleTarget user = 3;
  // The effect's `target` picks a random matching Pokemon. Spread and self-targeting moves (Cosmic Power...)
  // are handled like abilities' follow-up moves.
}

enum RuleLimit {
  RULE_LIMIT_NONE = 0;
  RULE_LIMIT_ONCE_PER_BATTLE = 1;
  RULE_LIMIT_ONCE_PER_MON = 2;
  RULE_LIMIT_ONCE_PER_ENTRY = 3;
}
